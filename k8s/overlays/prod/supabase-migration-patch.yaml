apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: jaybee-lab
spec:
  template:
    spec:
      containers:
        - name: migrate
          env:
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jaybee-supabase-migration-secret
                  key: MIGRATION_DATABASE_URL
          volumeMounts:
            - name: supabase-ca
              mountPath: /etc/supabase-ca
              readOnly: true
      volumes:
        - name: supabase-ca
          configMap:
            name: jaybee-supabase-ca
