apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jaybee-lab
spec:
  template:
    spec:
      containers:
        - name: backend
          volumeMounts:
            - name: supabase-ca
              mountPath: /etc/supabase-ca
              readOnly: true
      volumes:
        - name: supabase-ca
          configMap:
            name: jaybee-supabase-ca
