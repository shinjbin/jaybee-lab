apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- ../../optional
- supabase-network-policy.yaml

images:
- name: jaybee-lab/backend
  newName: ghcr.io/shinjbin/jaybee-lab-backend
  newTag: sha-f3ce6d380be1be8eab1d80a6e1a057c76306a4bd
- name: jaybee-lab/bitcoin-trader
  newName: ghcr.io/shinjbin/jaybee-lab-bitcoin-trader
  newTag: sha-f3ce6d380be1be8eab1d80a6e1a057c76306a4bd
- name: jaybee-lab/frontend
  newName: ghcr.io/shinjbin/jaybee-lab-frontend
  newTag: sha-f3ce6d380be1be8eab1d80a6e1a057c76306a4bd

patches:
- path: backend-supabase-tls-patch.yaml
- path: worker-supabase-tls-patch.yaml
- path: supabase-migration-patch.yaml
- path: backend-replicas-patch.yaml
- path: worker-replicas-patch.yaml
- path: cloudflared-replicas-patch.yaml
- path: bitcoin-trader-replicas-patch.yaml
