  newTag: sha-7bc666638342ce8b12847487ea679d780863949f

patches:
- path: backend-supabase-tls-patch.yaml
- path: worker-supabase-tls-patch.yaml
- path: supabase-migration-patch.yaml
- path: backend-replicas-patch.yaml
- path: worker-replicas-patch.yaml
- path: cloudflared-replicas-patch.yaml
- path: bitcoin-trader-replicas-patch.yaml
