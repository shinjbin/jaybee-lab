apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoin-trader
  namespace: jaybee-lab
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bitcoin-trader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitcoin-trader
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bitcoin-trader
          image: jaybee-lab/bitcoin-trader:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: jaybee-config
            - secretRef:
                name: jaybee-trader-secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
