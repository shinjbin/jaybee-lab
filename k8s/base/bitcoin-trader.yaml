apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoin-trader
  namespace: jaybee-lab
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bitcoin-trader
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bitcoin-trader
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bitcoin-trader
          image: jaybee-lab/bitcoin-trader:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: jaybee-config
            - secretRef:
                name: jaybee-trader-secret
          env:
            # Deployment order checks use /orders/test; the trading loop stays simulated.
            - name: DRY_RUN
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # main.py chooses separate dry-run/live files inside this durable directory.
            - name: TRADER_DATA_DIR
              value: /data
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: state
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: bitcoin-trader-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitcoin-trader-state
  namespace: jaybee-lab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
