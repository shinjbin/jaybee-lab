apiVersion: v1
kind: ConfigMap
metadata:
  name: jaybee-config
  namespace: jaybee-lab
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
data:
  NODE_ENV: production
  PORT: "3000"
  DATABASE_HOST: postgres
  DATABASE_INIT_RETRIES: "20"
  DATABASE_RETRY_DELAY_MS: "3000"
  NEWS_POLL_INTERVAL_MINUTES: "120"
  NEWS_PROVIDERS: gnews,yahoo-finance
  NEWS_SUMMARY_BATCH_SIZE: "10"
  BRIEFING_WINDOW_HOURS: "48"
  GNEWS_BASE_URL: https://gnews.io/api/v4
  GNEWS_ENDPOINT: search
  GNEWS_QUERY: stock market OR finance OR investing OR earnings OR inflation OR federal reserve
  GNEWS_TOPIC: business
  GNEWS_LANGUAGE: en
  GNEWS_COUNTRY: us
  GNEWS_MAX: "10"
  GNEWS_CATEGORY: market
  YAHOO_FINANCE_BASE_URL: https://query1.finance.yahoo.com
  YAHOO_FINANCE_SEARCH_TERMS: stock market,earnings,inflation,federal reserve
  YAHOO_FINANCE_NEWS_COUNT: "8"
  YAHOO_FINANCE_CATEGORY: market
  TOSS_INDEX_HISTORY_DAYS: "4000"
  TWELVE_DATA_BASE_URL: https://api.twelvedata.com
  TWELVE_DATA_HISTORY_DAYS: "4000"
  MARKET_CACHE_TTL_SECONDS: "900"
  TWELVE_DATA_SERIES: '[{"symbol":"USD/KRW","displaySymbol":"USD/KRW","name":"USD to KRW","market":"FX"}]'
  YAHOO_INDEX_SERIES: '[{"symbol":"^NDX","displaySymbol":"NASDAQ","name":"Nasdaq 100","market":"US"},{"symbol":"^DJI","displaySymbol":"DOW","name":"Dow Jones","market":"US"},{"symbol":"^GSPC","displaySymbol":"S&P 500","name":"S&P 500","market":"US"}]'
  COMMODITY_SERIES: '[{"symbol":"GC=F","displaySymbol":"GOLD","name":"금","market":"COMEX","unit":"USD/트로이온스"},{"symbol":"SI=F","displaySymbol":"SILVER","name":"은","market":"COMEX","unit":"USD/트로이온스"},{"symbol":"CL=F","displaySymbol":"WTI","name":"WTI","market":"NYMEX","unit":"USD/배럴"}]'
  OPENAI_MODEL: gpt-4o-mini
  OPENAI_BASE_URL: https://api.openai.com/v1
  TOSS_BASE_URL: https://openapi.tossinvest.com
  TOSS_REQUEST_INTERVAL_MS: "500"
  TOSS_REQUEST_TIMEOUT_MS: "15000"
  TOSS_MARKET_FLOW_ENABLED: "true"
  TOSS_FLOW_TOP_COUNT: "10"
  TOSS_FLOW_UNIVERSE_COUNT: ""
  TOSS_FLOW_COLLECTION_START_HOUR: "8"
  TOSS_FLOW_COLLECTION_END_HOUR: "20"
  KRX_OPEN_API_BASE_URL: https://data-dbg.krx.co.kr
  KRX_KOSPI_STOCKS_PATH: /svc/apis/sto/stk_bydd_trd
  TRADING_EXCHANGE: upbit
  BINANCE_BASE_URL: https://api.binance.com
  BINANCE_SYMBOL: BTCUSDT
  BINANCE_INTERVAL: 1d
  UPBIT_SYMBOL: KRW-BTC
  UPBIT_INTERVAL: 1d
  BOLLINGER_PERIOD: "49"
  BOLLINGER_STDDEV: "1.8"
  FEE_RATE: "0.001"
  SLIPPAGE_RATE: "0.0005"
  POSITION_SIZE: "1"
  DRY_RUN: "true"
  INITIAL_CASH: "10000"
  HISTORY_LIMIT: "200"
  POLL_SECONDS: "5"
  STATUS_CHECK_SECONDS: "3600"
  STATUS_REPORT_SECONDS: "21600"
  API_TIMEOUT_SECONDS: "10"
  READ_RETRIES: "3"
  UPBIT_BASE_URL: https://api.upbit.com
  STARTUP_HEALTH_ENABLED: "true"
  STARTUP_ORDER_TEST_ENABLED: "true"
  STARTUP_NOTIFICATION_COOLDOWN_SECONDS: "3600"
