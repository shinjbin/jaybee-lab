apiVersion: v1
kind: Secret
metadata:
  name: jaybee-database-secret
  namespace: jaybee-lab
type: Opaque
stringData:
  POSTGRES_DB: news_digest
  POSTGRES_USER: news_user
  POSTGRES_PASSWORD: REPLACE_WITH_A_LONG_RANDOM_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: jaybee-api-secret
  namespace: jaybee-lab
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  ADMIN_API_KEY: REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS
---
apiVersion: v1
kind: Secret
metadata:
  name: jaybee-data-secret
  namespace: jaybee-lab
type: Opaque
stringData:
  GNEWS_API_KEY: ""
  TWELVE_DATA_API_KEY: ""
  OPENAI_API_KEY: ""
  KIS_APP_KEY: ""
  KIS_APP_SECRET: ""
  KRX_AUTH_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: jaybee-trader-secret
  namespace: jaybee-lab
type: Opaque
stringData:
  UPBIT_ACCESS_KEY: ""
