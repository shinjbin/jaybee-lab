# Copy to jaybee-app-database-secret.yaml and replace the password before applying.
# DATABASE_NAME must match POSTGRES_DB in the existing jaybee-database-secret.
apiVersion: v1
kind: Secret
metadata:
  name: jaybee-app-database-secret
  namespace: jaybee-lab
type: Opaque
stringData:
  DATABASE_NAME: "news_digest"
  DATABASE_USER: "news_app"
  # Use a separate password from POSTGRES_PASSWORD. Generate: openssl rand -hex 32
  DATABASE_PASSWORD: "REPLACE_WITH_AT_LEAST_32_RANDOM_CHARACTERS"
